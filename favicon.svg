<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="arduinoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00979D"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#00979D" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Microcontroller Pin Legs (Top & Bottom) -->
  <g stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="20" x2="32" y2="28"/>
    <line x1="48" y1="20" x2="48" y2="28"/>
    <line x1="64" y1="20" x2="64" y2="28"/>
    <line x1="80" y1="20" x2="80" y2="28"/>
    <line x1="96" y1="20" x2="96" y2="28"/>

    <line x1="32" y1="100" x2="32" y2="108"/>
    <line x1="48" y1="100" x2="48" y2="108"/>
    <line x1="64" y1="100" x2="64" y2="108"/>
    <line x1="80" y1="100" x2="80" y2="108"/>
    <line x1="96" y1="100" x2="96" y2="108"/>
  </g>

  <!-- IC Chip Body -->
  <rect x="24" y="28" width="80" height="72" rx="8" fill="#090D16" stroke="#1F2937" stroke-width="2"/>
  <!-- Orientation Notch -->
  <path d="M 24 60 A 4 4 0 0 1 24 68" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Arduino Infinity Symbol (Dual Loops) -->
  <g filter="url(#glow)">
    <!-- Left Loop (Negative) -->
    <circle cx="50" cy="64" r="14" fill="none" stroke="#00979D" stroke-width="4"/>
    <line x1="45" y1="64" x2="55" y2="64" stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Loop (Positive) -->
    <circle cx="78" cy="64" r="14" fill="none" stroke="#00979D" stroke-width="4"/>
    <line x1="73" y1="64" x2="83" y2="64" stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="78" y1="59" x2="78" y2="69" stroke="#F3F4F6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- PWM / Status LED Dot (Amber) -->
  <circle cx="94" cy="38" r="3" fill="#F59E0B"/>
</svg>